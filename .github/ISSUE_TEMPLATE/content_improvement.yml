name: Content improvement
description: 本文、構成、読みやすさの改善を提案します。
title: "[Content]: "
labels: ["content"]
body:
  - type: input
    id: page
    attributes:
      label: 対象ページ
      placeholder: verification.md または https://mind-upload.com/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 改善したい点
      description: 読みにくい点、不足している説明、構成上の問題を書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 可能なら修正文や章立て案を書いてください。
  - type: textarea
    id: sources
    attributes:
      label: 参考資料
      description: 出典、論文、データセット、関連Issueがあれば貼ってください。
