name: Bug report
description: 表示崩れ、リンク切れ、ビルド失敗などを報告します。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているかを短く書いてください。
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 対象ページ
      description: URL またはファイルパスを書いてください。
      placeholder: https://mind-upload.com/... または external/netpyne/about.html
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: できるだけ具体的に書いてください。
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: textarea
    id: expected
    attributes:
      label: 期待する状態
      description: どう表示・動作すべきかを書いてください。
  - type: textarea
    id: evidence
    attributes:
      label: スクリーンショット・ログ・補足
      description: 公開してよい情報だけを貼ってください。
