name: Validate Wiki Export

on:
  pull_request:
    paths:
      - "*.md"
      - "wiki/**"
      - "_layouts/**"
      - "assets/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "scripts/export_github_wiki.rb"
      - "scripts/check_github_wiki_export.rb"
      - ".github/workflows/validate-github-wiki-export.yml"
      - ".github/workflows/sync-github-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Export GitHub Wiki content
        run: scripts/export_github_wiki.rb

      - name: Validate GitHub Wiki export
        run: scripts/check_github_wiki_export.rb

      - name: Build Jekyll site
        run: bundle exec jekyll build
