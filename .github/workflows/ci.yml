name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - uses: actions/setup-node@v6
        if: hashFiles('automation/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Check automation scripts
        run: |
          if [ -f automation/package.json ]; then
            cd automation
            npm ci
            for script in *.js; do
              [ -e "$script" ] || continue
              node --check "$script"
            done
            for script in *.sh; do
              [ -e "$script" ] || continue
              bash -n "$script"
            done
          elif [ -d automation ]; then
            while IFS= read -r script; do
              [ -n "$script" ] || continue
              bash -n "$script"
            done < <(find automation -name "*.sh" -type f -print)
          fi
