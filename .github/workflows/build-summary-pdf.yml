name: Build Summary PDF

on:
  push:
    branches: ["main"]
    paths:
      - "summary_booklet.html"
      - "index.html"
      - "verification.html"
      - "tech_roadmap.html"
      - "perspective.html"
      - "datasets.html"
      - "issue.html"
      - "content_hub.html"
      - "wbe_101.html"
      - "eeg_101.html"
      - "faq.html"
      - "glossary.html"
      - "_layouts/**"
      - "assets/css/main.css"
      - ".github/pdf/**"
      - ".github/workflows/build-summary-pdf.yml"
      - "scripts/build_summary_booklet.rb"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-summary-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Generate summary booklet
        run: ruby scripts/build_summary_booklet.rb

      - name: Build site
        run: bundle exec jekyll build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Render A4 summary PDF
        run: |
          mkdir -p output/pdf
          python3 -m http.server 4010 --directory _site >/tmp/mind-upload-summary-pdf.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4010/summary_booklet.html >/dev/null; then
              break
            fi
            sleep 1
          done

          node .github/pdf/render-summary-pdf.mjs \
            "http://127.0.0.1:4010/summary_booklet.html" \
            "output/pdf/mind-upload-summary-booklet-a4.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: mind-upload-summary-booklet-a4
          path: output/pdf/mind-upload-summary-booklet-a4.pdf
          if-no-files-found: error
