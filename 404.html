<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — ページが見つかりません / マインドアップロード</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0d14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 24px;
    }
    .nf-code {
      font-family: var(--mono);
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 8px;
    }
    .nf-wrap h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 14px; font-weight: 700; }
    .nf-wrap p { color: var(--muted); max-width: 520px; margin: 0 auto 28px; }
    .nf-cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body id="top">
  <main class="nf-wrap">
    <div>
      <p class="nf-code">404</p>
      <h1>ページが見つかりません</h1>
      <p>お探しのページは存在しないか、単一ページ構成へ統合されました。トップから各セクションへ辿れます。</p>
      <div class="nf-cta">
        <a class="btn btn-primary" href="/">トップへ戻る →</a>
        <a class="btn btn-ghost" href="/#gaps">未解決ギャップ</a>
      </div>
    </div>
  </main>
</body>
</html>
