<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">マインドアップロード 2050</title>
  <desc id="desc">2026年から2050年までの全脳エミュレーションのシナリオ年表を示す共有用画像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0a0d14" offset="0"/>
      <stop stop-color="#10182b" offset=".62"/>
      <stop stop-color="#071018" offset="1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#5ed8c6" offset="0"/>
      <stop stop-color="#7aa2ff" offset=".72"/>
      <stop stop-color="#c89bff" offset="1"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
