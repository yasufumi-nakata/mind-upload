<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">忠実度は、目的とテストによって定まります</title><desc id="desc">何を保持するか → 測定の精度・費用 → モデルの詳細度 → テストで比較. 細かいモデルであること自体が、正しさの保証にはなりません</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2c"/><stop offset="1" stop-color="#0d1321"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#6bdaca"/></marker></defs><rect width="1000" height="350" rx="22" fill="url(#bg)"/><text x="50" y="54" fill="#e9edf7" font-family="system-ui,sans-serif" font-size="23" font-weight="650">忠実度は、目的とテストによって定まります</text><rect x="50.0" y="108" width="210.0" height="118" rx="14" fill="#17243a" stroke="#39546b"/><circle cx="77.0" cy="136" r="13" fill="#5ed8c6"/><text x="77.0" y="141" text-anchor="middle" font-size="14" font-family="system-ui" fill="#0a0d14">1</text><text x="155.0" y="185" text-anchor="middle" fill="#e9edf7" font-family="system-ui,sans-serif" font-size="18">何を保持するか</text><path d="M262.0 166h15" stroke="#6bdaca" stroke-width="2" marker-end="url(#arrow)"/><rect x="280.0" y="108" width="210.0" height="118" rx="14" fill="#17243a" stroke="#39546b"/><circle cx="307.0" cy="136" r="13" fill="#5ed8c6"/><text x="307.0" y="141" text-anchor="middle" font-size="14" font-family="system-ui" fill="#0a0d14">2</text><text x="385.0" y="185" text-anchor="middle" fill="#e9edf7" font-family="system-ui,sans-serif" font-size="18">測定の精度・費用</text><path d="M492.0 166h15" stroke="#6bdaca" stroke-width="2" marker-end="url(#arrow)"/><rect x="510.0" y="108" width="210.0" height="118" rx="14" fill="#17243a" stroke="#39546b"/><circle cx="537.0" cy="136" r="13" fill="#5ed8c6"/><text x="537.0" y="141" text-anchor="middle" font-size="14" font-family="system-ui" fill="#0a0d14">3</text><text x="615.0" y="185" text-anchor="middle" fill="#e9edf7" font-family="system-ui,sans-serif" font-size="18">モデルの詳細度</text><path d="M722.0 166h15" stroke="#6bdaca" stroke-width="2" marker-end="url(#arrow)"/><rect x="740.0" y="108" width="210.0" height="118" rx="14" fill="#17243a" stroke="#39546b"/><circle cx="767.0" cy="136" r="13" fill="#5ed8c6"/><text x="767.0" y="141" text-anchor="middle" font-size="14" font-family="system-ui" fill="#0a0d14">4</text><text x="845.0" y="185" text-anchor="middle" fill="#e9edf7" font-family="system-ui,sans-serif" font-size="18">テストで比較</text><path d="M950 242v22H52v-22" stroke="#7aa2ff" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><text x="500" y="309" text-anchor="middle" fill="#b6c9de" font-size="17" font-family="system-ui,sans-serif">細かいモデルであること自体が、正しさの保証にはなりません</text></svg>