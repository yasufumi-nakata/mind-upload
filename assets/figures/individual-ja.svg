<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">元の個体に固有の情報を、対照と比べます</title><desc id="d">A由来のモデル; 他個体・平均モデル; 各モデルの予測; Aの未使用データと比較. 評価する記憶の答えを、モデルの学習へ持ち込まない設計にします</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12283a"/><stop offset="1" stop-color="#101524"/></linearGradient></defs><rect width="1000" height="350" rx="22" fill="url(#bg)"/><text x="45" y="45" fill="#e9edf7" text-anchor="start" font-size="22" font-family="system-ui,sans-serif">元の個体に固有の情報を、対照と比べます</text><rect x="45" y="80" width="260" height="56" rx="14" stroke="#42617a" fill="#17283d"/><text x="175" y="115" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">A由来のモデル</text><path d="M305 108L370 171" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="45" y="190" width="260" height="56" rx="14" stroke="#42617a" fill="#17283d"/><text x="175" y="225" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">他個体・平均モデル</text><path d="M305 218L370 171" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="370" y="132" width="215" height="78" rx="14" stroke="#42617a" fill="#17283d"/><text x="477" y="166" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">同じ課題への予測</text><text x="477" y="192" fill="#b5c9de" text-anchor="middle" font-size="15" font-family="system-ui,sans-serif">各モデルを別々に評価</text><path d="M585 171L650 210" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="650" y="80" width="305" height="50" rx="14" stroke="#42617a" fill="#17283d"/><text x="802" y="111" fill="#e9edf7" text-anchor="middle" font-size="18" font-family="system-ui,sans-serif">個体Aの未使用データ</text><path d="M802 130L802 169" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="650" y="169" width="305" height="88" rx="14" stroke="#42617a" fill="#17283d"/><text x="802" y="202" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">予測誤差・介入応答を比較</text><text x="802" y="232" fill="#b5c9de" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif">元の個体との対応を判定</text><text x="500" y="318" fill="#b5c9de" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif">評価する記憶の答えを、モデルの学習へ持ち込まない設計にします</text></svg>