<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">同じ観測に合う、複数のモデル</title><desc id="d">観測データ; 候補モデル A / B / C; 新しい刺激・介入; 候補を比較. 予測の一致だけで、内部機構が一意に決まるとは限りません</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12283a"/><stop offset="1" stop-color="#101524"/></linearGradient></defs><rect width="1000" height="350" rx="22" fill="url(#bg)"/><text x="45" y="45" fill="#e9edf7" text-anchor="start" font-size="22" font-family="system-ui,sans-serif">同じ観測に合う、複数のモデル</text><rect x="38" y="123" width="180" height="90" rx="14" stroke="#42617a" fill="#17283d"/><text x="128" y="174" fill="#e9edf7" text-anchor="middle" font-size="19" font-family="system-ui,sans-serif">観測データ</text><path d="M218 168L302 100" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="304" y="76" width="165" height="48" rx="14" stroke="#42617a" fill="#17283d"/><text x="386" y="106" fill="#e9edf7" text-anchor="middle" font-size="18" font-family="system-ui,sans-serif">候補 A</text><path d="M469 100L555 168" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M218 168L302 173" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="304" y="149" width="165" height="48" rx="14" stroke="#42617a" fill="#17283d"/><text x="386" y="179" fill="#e9edf7" text-anchor="middle" font-size="18" font-family="system-ui,sans-serif">候補 B</text><path d="M469 173L555 168" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M218 168L302 246" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="304" y="222" width="165" height="48" rx="14" stroke="#42617a" fill="#17283d"/><text x="386" y="252" fill="#e9edf7" text-anchor="middle" font-size="18" font-family="system-ui,sans-serif">候補 C</text><path d="M469 246L555 168" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="555" y="120" width="203" height="96" rx="14" stroke="#42617a" fill