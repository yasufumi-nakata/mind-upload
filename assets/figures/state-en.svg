<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Brain model and observation process</title><desc id="d">State x(t); Properties θ(t); Rules F &amp; G; Observation Hφ → y. Distinguish observations y_k = Hφ(x≤t_k) + η_k from model states</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12283a"/><stop offset="1" stop-color="#101524"/></linearGradient></defs><rect width="1000" height="350" rx="22" fill="url(#bg)"/><text x="45" y="45" fill="#e9edf7" text-anchor="start" font-size="22" font-family="system-ui,sans-serif">Brain model and observation process</text><rect x="45" y="80" width="440" height="168" rx="14" stroke="#42617a" fill="#17283d"/><text x="265" y="111" fill="#e9edf7" text-anchor="middle" font-size="19" font-family="system-ui,sans-serif">Brain states and updates</text><text x="265" y="150" fill="#a7c4ff" text-anchor="middle" font-size="22" font-family="system-ui,sans-serif">xₜ₊₁ = F(xₜ, uₜ; θₜ)</text><text x="265" y="191" fill="#a7c4ff" text-anchor="middle" font-size="22" font-family="system-ui,sans-serif">θₜ₊₁ = Gψ(θₜ, xₜ, uₜ)</text><text x="265" y="226" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">x: state / θ: properties / u: input</text><path d="M485 164L540 164" stroke="#5e9dba" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="540" y="80" width="415" height="168" rx="14" stroke="#42617a" fill="#17283d"/><text x="747" y="111" fill="#e9edf7" text-anchor="middle" font-size="19" font-family="system-ui,sans-serif">Measurement and processing Hφ</text><text x="747" y="157" fill="#6ce0cc" text-anchor="middle" font-size="23" font-family="system-ui,sans-serif">yₖ = Hφ(x≤tₖ) + ηₖ</text><text x="747" y="196" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">φ: calibration / η: observation error</text><text x="747" y="227" fill="#e9edf7" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">y: the signal actually observed</text><text x="500" y="318" fill="#b5c9de" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif">Distinguish observations y_k = Hφ(x≤t_k) + η_k from model states</text></svg>