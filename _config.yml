title: マインドアップロード
description: マインドアップロードへ向けた実践的で証拠に基づく作業の中核サイト
lang: ja
author: マインドアップロード研究プロジェクト
url: https://mind-upload.com
baseurl: ""
wiki_mode: local

# ビルド設定
theme: minima
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 既定値
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# 処理対象から除外
exclude:
  - .agent
  - .github
  - automation
  - github-wiki-export
  - ignore
  - scripts
  - vendor
  - .bundle
  - _site
  - node_modules
  - mind-upload.com
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - AGENTS.md
  - README.md
  - requirements.txt
  - "*.json"
  - "*.csv"
