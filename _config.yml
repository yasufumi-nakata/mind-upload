title: マインドアップロード
description: マインドアップロードへ向けた実践的で証拠に基づく作業の中核サイト
url: https://mind-upload.com
baseurl: ""
wiki_mode: github
github_wiki_url: https://github.com/yasufumi-nakata/mind-upload/wiki

# ビルド設定
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# 既定値
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# 処理対象から除外
exclude:
  - automation
  - github-wiki-export
  - ignore
  - vendor
  - .bundle
  - _site
  - node_modules
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - "*.json"
